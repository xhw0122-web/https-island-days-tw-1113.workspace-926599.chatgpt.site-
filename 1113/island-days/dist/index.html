<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#284f40"><meta name="description" content="島日子：給日常一點出走的理由。探索台灣展覽、市集、表演與週末活動的互動原型，活動附官方參考連結。">
  <title>島日子｜給日常一點出走的理由</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-bar"><span>✓ 真實活動・附官方／主辦參考連結</span><span class="demo-date">資料查核 2026/11/13</span></div>
  <header class="header"><div class="header-inner">
    <a class="brand" href="#" aria-label="島日子首頁"><span class="brand-mark">島</span><span>島日子<small>ISLAND DAYS</small></span></a>
    <nav class="desktop-nav" aria-label="主選單"><button data-tab="explore" class="active">探索活動</button><button data-tab="map">地圖探索</button><button data-tab="saved">我的收藏 <span class="saved-count">0</span></button></nav>
    <button id="city-button" class="location-button"><span data-icon="pin"></span><span id="city-label">全台灣</span><span>⌄</span></button>
  </div></header>
  <main id="main"></main>
  <footer class="footer"><span>島日子 ISLAND DAYS · 把日子過成喜歡的樣子。</span><p>活動依官方或主辦資料人工整理，查核日期2026/11/13，非即時同步；圖片為情境示意。未確認費用不列為免費。</p><label>介面狀態預覽 <select id="scenario"><option value="normal">正常瀏覽</option><option value="loading">載入中</option><option value="error">網路錯誤</option><option value="empty">無搜尋結果</option></select></label></footer>
  <nav class="bottom-nav" aria-label="底部分頁"><button data-tab="explore" class="active"><span data-icon="compass"></span>探索</button><button data-tab="map"><span data-icon="map"></span>地圖</button><button data-tab="saved"><span data-icon="heart"></span>收藏 <i class="saved-count">0</i></button></nav>
  <dialog id="filter-dialog" class="sheet"><form id="filter-form"><div class="sheet-heading"><div><small>MAKE IT YOUR DAY</small><h2>找到你的好日子</h2></div><button type="button" class="icon-button close-dialog" aria-label="關閉篩選">✕</button></div>
    <label class="field-label" for="city">想去哪裡</label><select name="city" id="city"></select>
    <span class="field-label">什麼時候</span><div class="date-presets"><button type="button" data-period="any">不限日期</button><button type="button" data-period="today">今天</button><button type="button" data-period="weekend">本週末</button></div>
    <div class="date-fields"><label>開始日期<input id="start-date" name="start" type="date"></label><span>—</span><label>結束日期<input id="end-date" name="end" type="date"></label></div>
    <span class="field-label">喜歡哪一種？ <small>可複選</small></span><div id="type-options" class="type-options"></div>
    <span class="field-label">活動費用</span><div class="fee-options"><label><input name="fee" type="radio" value="all" checked>不限</label><label><input name="fee" type="radio" value="free">免費</label><label><input name="fee" type="radio" value="paid">付費</label></div>
    <p id="filter-error" role="alert"></p><div class="sheet-actions"><button id="clear-filters" type="button" class="text-button">全部清除</button><button type="submit" class="primary">顯示活動 <span>↗</span></button></div>
  </form></dialog>
  <dialog id="detail-dialog" class="detail-dialog"></dialog>
  <dialog id="location-dialog" class="sheet compact"><div class="sheet-heading"><h2>附近有什麼好玩的？</h2><button class="icon-button close-dialog" aria-label="關閉定位說明">✕</button></div><p>同意後，只在這次探索使用你的目前位置，不儲存位置歷史。地圖顯示場館參考位置；地圖服務會依畫面範圍載入圖磚。</p><p id="location-message" role="status">也可以手動選擇縣市，不需開啟定位。</p><button id="allow-location" class="primary">使用目前位置</button><button id="manual-location" class="secondary">手動選擇縣市</button></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="activities.js"></script><script src="app.js"></script>
</body></html>
